<!DOCTYPE html>
<html lang="jp">
<head>
  <meta charset="UTF-8" name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
  <title>CSS test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="container">
<div id="field-menu">
  <div style="display:inline">
    <input type="checkbox" id="extra" name="extra" checked /><label id="app" for="extra">EXゾーン</label>
  </div>
  <div style="display:inline">
    <input type="radio" id="master" name="rule" value="master" checked /><label for="master">マスター</label>
  </div>
  <div style="display:inline">
    <input type="radio" id="speed" name="rule" value="speed" /><label for="speed">スピード</label>
  </div>
  <div align="right"><button type="button">特殊タグをクリップボードに出力</button></div>
</div>

<div id="field-preview">
<input type="radio" data-row="1" data-column="1" name="zone" />
<div class="zone" data-row="1" data-column="1"><div class="card-container"></div></div>
<input type="radio" data-row="1" data-column="2" name="zone" />
<div class="zone" data-row="1" data-column="2"><div class="card-container"></div></div>
<input type="radio" data-row="1" data-column="3" name="zone" />
<div class="zone" data-row="1" data-column="3"><div class="card-container"></div></div>
<input type="radio" data-row="1" data-column="4" name="zone" />
<div class="zone" data-row="1" data-column="4"><div class="card-container"><div class="card defense" data-card-type="trap"></div></div></div>
<input type="radio" data-row="1" data-column="5" name="zone" />
<div class="zone" data-row="1" data-column="5"><div class="card-container"><div class="card" data-card-type="magic"></div></div></div>

<input type="radio" data-row="2" data-column="1" name="zone" />
<div class="zone" data-row="2" data-column="1"><div class="status-label"></div><div class="card-container"></div></div>
<input type="radio" data-row="2" data-column="2" name="zone" />
<div class="zone" data-row="2" data-column="2"><div class="status-label"></div><div class="card-container"></div></div>
<input type="radio" data-row="2" data-column="3" name="zone" />
<div class="zone" data-row="2" data-column="3"><div class="status-label"></div><div class="card-container"></div></div>
<input type="radio" data-row="2" data-column="4" name="zone" />
<div class="zone" data-row="2" data-column="4"><div class="status-label"></div><div class="card-container"><div class="card defense" data-card-type="effect"></div></div></div>
<input type="radio" data-row="2" data-column="5" name="zone" />
<div class="zone" data-row="2" data-column="5"><div class="status-label"></div><div class="card-container"><div class="card" data-card-type="effect"></div></div></div>

<div class="zone" data-row="3" data-column="1"></div>
<input type="radio" data-row="3" data-column="2" name="zone" />
<div class="zone" data-row="3" data-column="2"><div class="status-label"></div><div class="card-container"></div><div class="status-label"></div></div>
<div class="zone" data-row="3" data-column="3"></div>
<input type="radio" data-row="3" data-column="4" name="zone" />
<div class="zone" data-row="3" data-column="4"><div class="status-label"></div><div class="card-container"><div class="card" data-card-type="link"></div></div><div class="status-label"></div></div>

<input type="radio" data-row="4" data-column="1" name="zone" />
<div class="zone" data-row="4" data-column="1"><div class="card-container"><div class="card" data-card-type="fusion"></div></div><div class="status-label"></div></div>
<input type="radio" data-row="4" data-column="2" name="zone" />
<div class="zone" data-row="4" data-column="2"><div class="card-container"><div class="card" data-card-type="synchro"></div></div><div class="status-label"></div></div>
<input type="radio" data-row="4" data-column="3" name="zone" />
<div class="zone" data-row="4" data-column="3"><div class="card-container"><div class="card" data-card-type="xyz"></div></div><div class="status-label"></div></div>
<input type="radio" data-row="4" data-column="4" name="zone" />
<div class="zone" data-row="4" data-column="4"><div class="card-container"><div class="card defense" data-card-type="ritual"></div></div><div class="status-label"></div></div>
<input type="radio" data-row="4" data-column="5" name="zone" />
<div class="zone" data-row="4" data-column="5"><div class="card-container"><div class="card defense" data-card-type="effect"></div></div><div class="status-label"></div></div>

<input type="radio" data-row="5" data-column="1" name="zone" />
<div class="zone" data-row="5" data-column="1"><div class="card-container"><div class="card pendulum" data-card-type="normal"></div></div></div>
<input type="radio" data-row="5" data-column="2" name="zone" />
<div class="zone" data-row="5" data-column="2"><div class="card-container"><div class="card" data-card-type="magic"></div></div></div>
<input type="radio" data-row="5" data-column="3" name="zone" />
<div class="zone" data-row="5" data-column="3"><div class="card-container"><div class="card" data-card-type="trap"></div></div></div>
<input type="radio" data-row="5" data-column="4" name="zone" />
<div class="zone" data-row="5" data-column="4"><div class="card-container"></div></div>
<input type="radio" data-row="5" data-column="5" name="zone" />
<div class="zone" data-row="5" data-column="5"><div class="card-container"><div class="card"></div></div></div>
</div>
  
<div id="setting-pane">
  <div class="tab-button"><input type="radio" name="TAB" id="card" checked><label for="card">カード情報</label></div>
  <div class="tab-content">
    <div style="grid-column: 1 / span 2;">
      <label for="name">カード名：</label><input type="text" id="name" name="name" />
    </div>
    <div>
      <div>
        <label for="name-color-hex">文字色：</label><input type="text" inputmode="url" pattern="^#([0-9a-fA-F]{3}){1,2}$" placeholder="#000000" id="name-color-hex" maxlength="7" oninput="syncColor(event,'name-color-picker')" /><input type="color" id="name-color-picker" oninput="syncColor(event,'name-color-hex')" />
      </div>
	  <div>
        <label for="card-type">カード種別：</label><select name="card-type" id="card-type">
          <option value="empty">空きゾーン</option>
          <option value="facedown">裏側表示</option>
          <option value="token">トークン</option>
          <option value="normal">通常</option>
          <option value="effect">効果</option>
          <option value="fusion">融合</option>
          <option value="ritual">儀式</option>
          <option value="syncro">シンクロ</option>
          <option value="xyz">エクシーズ</option>
          <option value="link">リンク</option>
          <option value="magic">魔法</option>
          <option value="trap">罠</option>
        </select>
	  </div>
      <div>
        <label for="bg-color-hex">ｲﾗｽﾄ背景：</label><input type="text" inputmode="url" pattern="^#([0-9a-fA-F]{3}){1,2}$" placeholder="#808080" id="bg-color-hex" maxlength="7" oninput="syncColor(event,'bg-color-picker')" /><input type="color" id="bg-color-picker" value="#808080" oninput="syncColor(event,'bg-color-hex')" />
      </div>
	  <div>
        <label for="icon-type">ｱｲｺﾝ：</label><select name="icon-type" id="icon-type">
          <option value="empty">無し</option>
          <option value="negate">無効状態</option>
          <option value="continuous">永続</option>
          <option value="equip">装備</option>
          <option value="quick">速攻</option>
          <option value="ritual">儀式</option>
          <option value="counter">カウンター</option>
          <option value="level">レベル表示</option>
          <option value="rank">ランク表示</option>
          <option value="xyz-material">X素材表示</option>
          <option value="custom">カスタム</option>
        </select><input type="text" inputmode="numeric" placeholder="0" id="icon-parameter" size=1 />
	  </div>
      <div class="status-input">
        <div style="display:inline-block;"><input type="radio" id="attack" name="position" value="attack" checked /><label for="attack">攻</label><input type="text" inputmode="url" pattern="[0-9]*|[?∞]" placeholder="0" id="atk" name="atk" /></div>
        <div style="display:inline-block;"><input type="radio" id="defense" name="position" value="defense" /><label for="defense">守</label><input type="text" inputmode="url" pattern="[0-9]*|[?∞]" placeholder="0" id="def" name="def" /></div>
      </div>
      <div>
        <label>ｺﾝﾄﾛｰﾙ：</label><input type="radio" id="player" name="controller" value="player" checked /><label for="player">自分</label><input type="radio" id="opponent" name="controller" value="opponent" /><label for="opponent">相手</label>
      </div>
    </div>
    
    <div>
	  <div>
        <input type="checkbox" id="pendulum" name="pendulum" /><label for="pendulum">ペンデュラム</label>
      </div>
	  <div>
        <label for="pendulum-scale">スケール：</label><input type="text" inputmode="numeric" placeholder="0" id="pendulum-scale" size=1 />
      </div>
      <div class="link-marker-grid">
        <label class="link-marker"><input type="checkbox" id="top-left">◤</label>
        <label class="link-marker" style="transform:rotate(45deg);"><input type="checkbox" id="top">◤</label>
        <label class="link-marker"><input type="checkbox" id="top-right">◥</label>
        <label class="link-marker" style="transform:rotate(45deg);"><input type="checkbox" id="left">◣</label>
        <input type="checkbox" id="link-marker">
        <label class="link-marker" style="transform:rotate(45deg);"><input type="checkbox" id="right">◥</label>
        <label class="link-marker"><input type="checkbox" id="bottom-left">◣</label>
        <label class="link-marker" style="transform:rotate(45deg);"><input type="checkbox" id="bottom">◢</label>
        <label class="link-marker"><input type="checkbox" id="bottom-right">◢</label>
      </div>
    </div>
  </div>

  <div class="tab-button"><input type="radio" name="TAB" id="design"><label for="design">デザイン設定</label></div>
  <div class="tab-content">
    <div>
      <label for="atk">枠背景色：#</label><input type="text" inputmode="url" pattern="[0-9a-fA-F]{6}|[0-9a-fA-F]{3}" placeholder="000000" id="bg-color" name="bg-color" maxlength="6" size=5 />
    </div>
    <div>
      <label for="atk">文字色：#</label><input type="text" inputmode="url" pattern="[0-9a-fA-F]{6}|[0-9a-fA-F]{3}" placeholder="000000" id="icon-color" name="icon-color" maxlength="6" size=5 />
    </div>
    <div>
      <label for="atk">文字背景色：#</label><input type="text" inputmode="url" pattern="[0-9a-fA-F]{6}|[0-9a-fA-F]{3}" placeholder="000000" id="icon-bg-color" name="icon-bg-color" maxlength="6" size=5 />
    </div>
    <div>
      <label for="atk">文字サイズ：</label><input type="text" inputmode="url" pattern="" placeholder="1" id="icon-size" name="icon-size" size=5 />
    </div>
  </div>

</div>
<script>
  
function syncColor(event, destId){
	let hex = event.target.value.trim().toUpperCase();
    if (/^#([0-9A-F]{3}){1,2}$/i.test(hex)) {
        if (hex.length === 4) {
            hex = "#" + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
        }
		document.getElementById(destId).value = hex;
	}
}
</script>
</body>
</html>
